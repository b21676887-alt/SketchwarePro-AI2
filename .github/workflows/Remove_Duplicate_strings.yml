name: Remove Duplicate Strings Keys

on:
  push:
    branches:
      - '**' # يعمل عند الرفع على أي فرع
    paths:
      - '**/strings.xml' # يعمل عند وجود تغييرات في ملفات strings.xml
  workflow_dispatch: # يتيح التشغيل اليدوي من واجهة GitHub

jobs:
  clean-duplicates:
    name: Clean Duplicate Keys
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Remove Duplicate Keys from strings.xml
        run: |
          # البحث عن ملف strings.xml
          STRINGS_FILE=$(find . -name "strings.xml" | head -n 1)

          if [ -n "$STRINGS_FILE" ]; then
            echo "Processing duplicate keys in $STRINGS_FILE..."
            
            python3 - "$STRINGS_FILE" << 'EOF'
import sys
import xml.etree.ElementTree as ET

file_path = sys.argv[1]

# قراءة وحفظ البنية الهيكلية للملف
tree = ET.parse(file_path)
root = tree.getroot()

seen_names = set()
duplicates_count = 0

# التكرار على العناصر بحذر وحذف المكرر
for elem in list(root):
    if elem.tag == 'string':
        name = elem.get('name')
        if name in seen_names:
            root.remove(elem)
            duplicates_count += 1
        else:
            seen_names.add(name)

if duplicates_count > 0:
    # إعادة كتابة الملف بدون المفاتيح المكررة
    tree.write(file_path, encoding='utf-8', xml_declaration=True)
    print(f"Successfully removed {duplicates_count} duplicate key(s).")
else:
    print("No duplicate keys found.")
EOF
          else:
            echo "Warning: strings.xml file not found."
          fi

      - name: Commit and Push Cleaned Files
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "chore: Remove duplicate keys from strings.xml [skip ci]" || echo "No changes to commit"
          git push
